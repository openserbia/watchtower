name: Publish Docs

on:
  workflow_dispatch: { }
  # zizmor: ignore[dangerous-triggers] only follows "Release (Production)", which is push/dispatch-triggered and never fork-reachable
  workflow_run:
    workflows: [ "Release (Production)" ]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-docs:
    name: Publish Docs
    runs-on: [self-hosted, x64]
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] job pushes with git
        with:
          fetch-depth: 0
      - name: Build tplprev
        run: devbox run -- task tplprev
      - name: Install docs dependencies
        run: devbox run -- pip install -r docs-requirements.txt
      - name: Generate docs
        run: devbox run -- mkdocs gh-deploy --force --strict
